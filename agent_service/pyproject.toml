[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendar-agent"
version = "0.1.0"
description = "AI-powered calendar agent service with natural language interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Attila Bordan" }
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
calendar-agent = "calendar_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_agent"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

